name: Release CoffeeCup

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build CoffeeCup DMG
        run: ./scripts/create-dmg.sh

      - name: Upload CoffeeCup DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release upload "${GITHUB_REF_NAME}" \
              "build/CoffeeCup.dmg#CoffeeCup.dmg" \
              --clobber; then
              exit 0
            fi
            sleep 10
          done
          exit 1
