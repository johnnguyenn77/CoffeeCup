name: Release CoffeeCup

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build CoffeeCup DMG
        run: ./scripts/create-dmg.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "CoffeeCup ${RELEASE_TAG#v}" \
              --generate-notes
          fi

      - name: Prepare Homebrew cask
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          project_version="$(xcodebuild \
            -project CoffeeCup.xcodeproj \
            -scheme CoffeeCup \
            -configuration Release \
            -sdk macosx \
            -showBuildSettings 2>/dev/null \
            | awk -F ' = ' '/MARKETING_VERSION/ { print $2; exit }')"

          if [[ "$project_version" != "$version" ]]; then
            echo "Release tag $version does not match project version $project_version." >&2
            exit 1
          fi

          sha256="$(shasum -a 256 build/CoffeeCup.dmg | awk '{ print $1 }')"
          mkdir -p build
          cat > build/coffeecup.rb <<EOF
          cask "coffeecup" do
            version "$version"
            sha256 "$sha256"

            url "https://github.com/johnnguyenn77/CoffeeCup/releases/download/v#{version}/CoffeeCup.dmg"
            name "CoffeeCup"
            desc "Menu bar app for toggling caffeinate"
            homepage "https://github.com/johnnguyenn77/CoffeeCup"

            depends_on macos: :ventura

            app "CoffeeCup.app"
          end
EOF

      - name: Upload CoffeeCup DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" \
              "build/CoffeeCup.dmg#CoffeeCup.dmg" \
              --clobber; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Update Homebrew cask on main
        run: |
          set -euo pipefail

          git fetch origin main
          git switch --create cask-update --track origin/main
          mkdir -p Casks
          cp build/coffeecup.rb Casks/coffeecup.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/coffeecup.rb

          if git diff --cached --quiet; then
            echo "Homebrew cask is already current."
            exit 0
          fi

          git commit -m "Update CoffeeCup cask to ${RELEASE_TAG#v}"
          git push origin HEAD:main
